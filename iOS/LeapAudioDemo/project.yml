name: LeapAudioDemo
options:
  bundleIdPrefix: ai.liquid.examples
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en

schemes:
  LeapAudioDemo:
    build:
      targets:
        LeapAudioDemo: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  LeapAudioDemoTests:
    build:
      targets:
        LeapAudioDemo: all
        LeapAudioDemoTests: all
    test:
      config: Debug
      targets:
        - LeapAudioDemoTests

configs:
  Debug: debug
  Release: release

settings:
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"

packages:
  LeapSDK:
    path: ../ThirdParty/leap-ios

targets:
  LeapAudioDemo:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LeapAudioDemo
        excludes:
          - "Resources/**"
          - "Gallery/Data/**"
          - "Exhibits/Data/**"
    resources:
      - path: LeapAudioDemo/Assets.xcassets
        name: Assets
      - path: LeapAudioDemo/Resources
        excludes:
          - ".gitkeep"
    dependencies:
      - package: LeapSDK
        product: LeapSDK
      - package: LeapSDK
        product: LeapModelDownloader
    postBuildScripts:
      - script: |
          cp -f "${SRCROOT}/LeapAudioDemo/Resources"/*.gguf "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
        name: Copy GGUF Models
        basedOnDependencyAnalysis: false
      - script: |
          mkdir -p "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Gallery/Data"
          rsync -a "${SRCROOT}/LeapAudioDemo/Gallery/Data/" "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Gallery/Data/"
          mkdir -p "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Exhibits/Data"
          rsync -a "${SRCROOT}/LeapAudioDemo/Exhibits/Data/" "${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Exhibits/Data/"
          echo "[Copy JSON Data] Copied Gallery/Data and Exhibits/Data"
        name: Copy JSON Data
        basedOnDependencyAnalysis: false
      - script: |
          APP_DIR="${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
          if [ -d "${APP_DIR}" ]; then
            find "${APP_DIR}" -name '._*' -print -delete || true
            find "${APP_DIR}" -exec xattr -c {} + || true
          fi
          if [ -d "${TARGET_BUILD_DIR}" ]; then
            find "${TARGET_BUILD_DIR}" -name '._*' -print -delete || true
            find "${TARGET_BUILD_DIR}" -exec xattr -c {} + || true
          fi
          if [ -d "${SRCROOT}/LeapAudioDemo/Exhibits/Data" ]; then
            find "${SRCROOT}/LeapAudioDemo/Exhibits/Data" -name '._*' -print -delete || true
            find "${SRCROOT}/LeapAudioDemo/Exhibits/Data" -exec xattr -c {} + || true
          fi
          echo "[Sanitize Bundle] Cleaned ${APP_DIR}"
        name: Sanitize Bundle (codesign)
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.liquid.examples.LeapAudioDemo
        DEVELOPMENT_TEAM: WH7Z9N74X5
        CODE_SIGN_IDENTITY: "iPhone Developer"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Audio input is used to capture prompts."
        INFOPLIST_KEY_UIBackgroundModes: "audio"
        SWIFT_EMIT_LOC_STRINGS: YES
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_COMPILATION_MODE: wholemodule

  LeapAudioDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LeapAudioDemoTests
    dependencies:
      - target: LeapAudioDemo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LeapAudioDemo.app/LeapAudioDemo"
